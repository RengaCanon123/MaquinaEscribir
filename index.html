<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vintage Typewriter</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Abril+Fatface&family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

    <h1>VINTAGE TYPEWRITER</h1>

    <!-- =======================
            CONTROLES
    ======================== -->

    <section class="controls-wrapper">

        <div class="controls">

            <button class="btn" onclick="clearPaper()">
                Limpiar hoja
            </button>

            <button class="btn" onclick="downloadLetter()">
                Descargar carta
            </button>

        </div>

        <div class="mode-selector">

            <label>

                <input
                    type="radio"
                    name="writeMode"
                    value="typewriter"
                    checked>

                Máquina de escribir

            </label>

            <label>

                <input
                    type="radio"
                    name="writeMode"
                    value="cutout">

                Carta anónima

            </label>

        </div>

    </section>

    <!-- =======================
            MÁQUINA
    ======================== -->

    <main class="typewriter">

        <!-- Rodillo -->

        <div class="platen">

            <div class="knob left"></div>

            <div class="roller"></div>

            <div class="knob right"></div>

        </div>

        <!-- Barra -->

        <div class="paper-holder"></div>

        <!-- Papel -->

        <section
            class="paper-container"
            id="paper-container">

            <div
                id="paper-content">
            </div>

            <span
                class="cursor"
                id="cursor">
            </span>

        </section>

        <!-- Panel -->

        <div class="front-panel">

            <div class="brand">

                VINTAGE

            </div>

            <div class="gold-line"></div>

        </div>

        <!-- =======================
                TECLADO
        ======================== -->

        <section
            class="keyboard"
            id="keyboard">

            <div class="keyboard-row">

                <div class="key" data-key="Q">Q</div>
                <div class="key" data-key="W">W</div>
                <div class="key" data-key="E">E</div>
                <div class="key" data-key="R">R</div>
                <div class="key" data-key="T">T</div>
                <div class="key" data-key="Y">Y</div>
                <div class="key" data-key="U">U</div>
                <div class="key" data-key="I">I</div>
                <div class="key" data-key="O">O</div>
                <div class="key" data-key="P">P</div>

            </div>

            <div class="keyboard-row">

                <div class="key" data-key="A">A</div>
                <div class="key" data-key="S">S</div>
                <div class="key" data-key="D">D</div>
                <div class="key" data-key="F">F</div>
                <div class="key" data-key="G">G</div>
                <div class="key" data-key="H">H</div>
                <div class="key" data-key="J">J</div>
                <div class="key" data-key="K">K</div>
                <div class="key" data-key="L">L</div>
                <div class="key" data-key="Ñ">Ñ</div>

            </div>

            <div class="keyboard-row">

                <div class="key" data-key="Z">Z</div>
                <div class="key" data-key="X">X</div>
                <div class="key" data-key="C">C</div>
                <div class="key" data-key="V">V</div>
                <div class="key" data-key="B">B</div>
                <div class="key" data-key="N">N</div>
                <div class="key" data-key="M">M</div>

                <div
                    class="key key-wide"
                    data-key="Backspace">

                    BORRAR

                </div>

            </div>

            <div class="keyboard-row">

                <div
                    class="key key-space"
                    data-key=" ">

                    ESPACIO

                </div>

                <div
                    class="key key-wide"
                    data-key="Enter">

                    ENTER

                </div>

            </div>

        </section>

    </main>

    <p class="hint">

        Puedes escribir usando el teclado físico o haciendo clic sobre las teclas.

    </p>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
